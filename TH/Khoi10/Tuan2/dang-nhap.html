  <h1 class="page-title">💻 Đăng nhập để nộp bài</h1>
  <p class="page-subtitle">Đăng nhập bằng tài khoản giáo viên đã cấp.</p>

  <div class="card auth-card">
    <h2>Đăng nhập</h2>
    <div class="form-field">
      <label>Họ và tên</label>
      <input type="text" id="login-hoten" placeholder="Nguyễn Văn A">
    </div>
    <div class="form-field">
      <label>Lớp</label>
      <input type="text" id="login-lop" placeholder="10A1">
    </div>
    <div class="form-field">
      <label>Mật khẩu</label>
      <input type="password" id="login-password" placeholder="Mật khẩu được cấp">
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Đăng nhập</button>
    <div class="form-msg" id="login-msg"></div>
    <p style="text-align:center; font-size:12px; color:var(--sub); margin-top:16px;">Chưa có tài khoản? Liên hệ giáo viên để được cấp.</p>
  </div>
</div>

<script>const BAI_ID = 'excel-tuan2';</script>
<script src="../../pocketbase-shared.js"></script>
<script>
  // Nếu đã đăng nhập từ trước, chuyển thẳng sang trang nộp bài
  const existingSession = SessionManager.load();
  if (existingSession) {
    window.location.href = 'nop-bai.html';
  }

  function showMsg(elId, text, ok) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'form-msg show ' + (ok ? 'ok' : 'bad');
  }

  async function doLogin() {
    const hoTen = document.getElementById('login-hoten').value.trim();
    const lop = document.getElementById('login-lop').value.trim();
    const password = document.getElementById('login-password').value;

    if (!hoTen || !lop || !password) {
      showMsg('login-msg', 'Vui lòng điền đầy đủ họ tên, lớp và mật khẩu.', false);
      return;
    }

    const result = await loginStudent(hoTen, lop, password);

    if (!result.success) {
      showMsg('login-msg', '❌ ' + result.message, false);
      return;
    }

    SessionManager.save(result.student_id, hoTen, lop);
    showMsg('login-msg', '✅ Đăng nhập thành công!', true);
    setTimeout(() => window.location.href = 'nop-bai.html', 500);
  }

  document.getElementById('login-password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
